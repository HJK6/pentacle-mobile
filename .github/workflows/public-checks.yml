name: Public checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: git fetch origin main
      - name: Public content boundary
        run: scripts/check-public-boundary.sh origin/main
      - run: npm ci
      - run: cp pentacle.config.example.ts pentacle.config.local.ts
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run validate
      - name: Remove synthetic local config
        if: always()
        run: rm -f pentacle.config.local.ts
