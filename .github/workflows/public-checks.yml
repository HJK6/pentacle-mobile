name: Public checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      daemon_ref:
        description: Daemon ref for the report-only run
        required: false
        type: string
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: git fetch origin main
      - name: Validate vendored chat core pin
        run: node scripts/check-provision-pin.cjs
      - name: Public content boundary
        run: scripts/check-public-boundary.sh origin/main
      - name: Private-terms pre-push check (synthetic dictionaries)
        run: python3 scripts/test_check_private_terms.py
      - run: npm ci
      - run: cp pentacle.config.example.ts pentacle.config.local.ts
      - name: Portable synthetic harness
        # Diagnostic capture requires simulator-only idb tooling.
        run: |
          python3 -m pip install -r test/e2e/tools/requirements.txt
          PYTHONPATH=test:test/e2e python3 -m pytest -q test/e2e/tests --ignore=test/e2e/tests/test_m1_diagnostic_capture.py
      - name: Vendored chat core
        run: npm ci --prefix pentacle-chat-core && npm --prefix pentacle-chat-core test
      - name: Configured synthetic dashboard mock
        run: node --test test/e2e/tests/test_dashboard_hub_mock_server.cjs
      - name: Native archive semantics for Hermes fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          mkdir -p "$RUNNER_TEMP/native-archive-tools"
          ln -s /usr/bin/bsdtar "$RUNNER_TEMP/native-archive-tools/tar"
          echo "$RUNNER_TEMP/native-archive-tools" >> "$GITHUB_PATH"
          /usr/bin/bsdtar --version
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run validate
      - name: Remove synthetic local config
        if: always()
        run: rm -f pentacle.config.local.ts

  daemon-pinned:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: cp pentacle.config.example.ts pentacle.config.local.ts
      - name: Pinned daemon journey
        run: python3 scripts/test-pinned-daemon.py

  daemon-main-report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: cp pentacle.config.example.ts pentacle.config.local.ts
      - name: Report daemon compatibility
        id: journey
        env:
          PENTACLE_DAEMON_REF: ${{ inputs.daemon_ref || 'main' }}
        run: |
          set -o pipefail
          python3 scripts/test-pinned-daemon.py 2>&1 | tee "$RUNNER_TEMP/daemon-report.log"
      - name: Summarize daemon compatibility
        if: always()
        env:
          JOURNEY_OUTCOME: ${{ steps.journey.outcome }}
        run: |
          report="$RUNNER_TEMP/daemon-report.log"
          runtime_sha=''
          stage=''
          if [ -f "$report" ]; then
            runtime_sha=$(sed -n 's/^.*welcome runtime_sha: //p' "$report" | tail -n 1)
            stage=$(sed -n 's/^stage: //p' "$report" | tail -n 1)
          fi
          echo "Result: ${JOURNEY_OUTCOME:-not run}; runtime_sha: ${runtime_sha:-unavailable}; first failing step: $([ "$JOURNEY_OUTCOME" = success ] && echo none || echo "${stage:-setup}")" >> "$GITHUB_STEP_SUMMARY"
