name: Public checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: git fetch origin main
      - name: Public content boundary
        run: scripts/check-public-boundary.sh origin/main
      - run: npm ci
      - run: cp pentacle.config.example.ts pentacle.config.local.ts
      - name: Portable synthetic harness
        run: |
          python3 -m pip install -r test/e2e/tools/requirements.txt
          PYTHONPATH=test/e2e python3 -m pytest test/e2e/tests/test_mock_v2_daemon.py test/e2e/tests/test_waivers_render.py test/e2e/tests/test_public_replay.py test/e2e/tests/test_public_harness_helpers.py
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run validate
      - name: Remove synthetic local config
        if: always()
        run: rm -f pentacle.config.local.ts
